# 🔴 고위험 스코어링 — 근거: report/phase-1-conception.md 과제 A
# theme_strength 는 llm_fed: Thematic Analyst(3b) 가 theme_strength_overrides 로 주입.
# 미주입 시 중립 0.5.
category: HIGH
max_positions: 15
components:
  - name: trend_momentum
    weight: 0.40
    metrics: [mom_12_1, rs_vs_spx_6m, pct_from_52w_high, sma_50_200_ratio]
    directions: [1, 1, 1, 1]
  - name: volume_confirm
    weight: 0.20
    metrics: [vol_ratio_latest]
    directions: [1]
  - name: theme_strength
    weight: 0.25
    metrics: [theme_strength]
    directions: [1]
    llm_fed: true
  - name: fundamental_optionality
    weight: 0.15
    metrics: [rev_growth_yoy]
    directions: [1]
subtiers:
  - name: HIGH-A 세큘러 테마
    filters:
      - { field: market_cap_usd, op: ">=", value: 20000000000 }
  - name: HIGH-B 모멘텀 돌파
    filters:
      - { field: pct_from_52w_high, op: ">=", value: -0.10 }
  - name: HIGH-C 스펙 옵셔널리티
    filters:
      - { field: market_cap_usd, op: "<", value: 20000000000 }
