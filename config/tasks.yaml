# CrewAI 태스크 정의. context/output_pydantic/guardrail/callback/async 는 crew.py 가 코드로 연결.
# {..._json} 플레이스홀더는 crew.py 가 kickoff(inputs=) 로 주입 (결정론 파이프라인 결과).
# macro_brief / fundamental_notes / thematic_notes / market_narrative 는 async (병렬).

macro_brief:
  agent: macro_strategist
  description: >
    아래 결정론 레짐 산출을 해석만 하라 (숫자 재생성 금지).

    [레짐 산출] {regime_json}
    [파이프라인 노트] {pipeline_notes}

    할 일: (1) 현재 레짐을 두세 문장으로 평이하게 설명, (2) 축 간 상충 나열,
    (3) 향후 2~4주 리스크 시나리오 2~3개, (4) 관찰 포인트.
    confidence 는 low_confidence 플래그와 n_axes_present 로 (high/medium/low). 배분 비중 언급 금지.
  expected_output: >
    MacroBrief JSON: regime, confidence(high|medium|low), axis_conflicts[], risk_scenarios[], watch_items[].

fundamental_notes:
  agent: fundamental_analyst
  description: >
    LOW/MID 스크리너·스코어러가 고른 상위 후보다. 점수는 확정값이니 인용만 하라.

    [LOW/MID 상위 후보] {low_mid_candidates_json}

    각 후보에 대해: thesis_1line(한 줄 논지), quality_flags(정성 리스크), valuation_trap(bool),
    exclude_recommended(bool). fundamentals·news_scraper 툴로 확인. 편입 강제 불가.
  expected_output: >
    FundamentalNotes JSON: notes[{ticker, thesis_1line, quality_flags[], valuation_trap, exclude_recommended}].

thematic_notes:
  agent: thematic_analyst
  description: >
    HIGH 스크리너·스코어러가 고른 후보다.

    [HIGH 상위 후보] {high_candidates_json}
    [레짐 요약] {regime_summary}

    각 후보에 대해: themes[], catalyst(다음 촉매), catalyst_date, crowding_flag(bool),
    momentum_durability(high|med|low), theme_strength_adj(-0.2~0.2 권고), exclude_recommended(bool).
    technical_indicators·news_scraper 로 확인.
  expected_output: >
    ThematicNotes JSON: notes[{ticker, themes[], catalyst, catalyst_date, crowding_flag,
    momentum_durability, theme_strength_adj, exclude_recommended}].

market_narrative:
  agent: news_analyst
  description: >
    news_scraper(scope=macro) 로 이번 주 시장 헤드라인을 훑어라.

    할 일: (1) weekly_summary — 시장 내러티브 3~4문장, (2) event_risks —
    매크로 6축에 안 잡히는 이벤트 {event, date, affected_sleeve(low|mid|high|all), severity(low|medium|high)}.
    이벤트 반영 여부는 판단하지 마라.
  expected_output: >
    MarketNarrative JSON: weekly_summary, event_risks[{event, date, affected_sleeve, severity}].

research_view:
  agent: research_director
  description: >
    위 컨텍스트에 MacroBrief / FundamentalNotes / ThematicNotes / MarketNarrative 가 있다.
    상충을 조정해 하우스뷰를 만들어라.

    할 일: (1) sleeve_stance — low/mid/high 각각 {stance(overweight|neutral|underweight), reason},
    (2) cross_risks — 슬리브 간 교차 리스크, (3) excluded_tickers — 애널리스트 제외 권고 종합,
    (4) notes — 한두 문장 요약. 직접 비중은 정하지 마라.
  expected_output: >
    ResearchView JSON: sleeve_stance{low,mid,high:{stance,reason}}, cross_risks[], excluded_tickers[], notes.

pm_draft:
  agent: portfolio_manager
  description: >
    결정론 초안을 하우스뷰에 맞춰 한도 내에서 틸트하라.

    [결정론 초안: 카테고리 목표(%) + 상위 풀 + 종목별 비중(%)] {det_draft_json}
    [하우스뷰 ResearchView] {research_view_json}
    [강제 제외 종목] {excluded_json}

    규칙: 카테고리 비중은 목표 ±3%p 이내. 종목은 top_pool 안에서만 (신규 편입 불가).
    excluded_json 종목은 반드시 제외. 티어 밴드·단일종목 8%·고위험 20%·현금 3% 불가침.
    슬리브 스탠스가 overweight 면 그 카테고리를 (한도 내) 늘리고 underweight 면 줄인다.
  expected_output: >
    PMDraft JSON: category_weights{low,mid,high,cash} (소수), positions[{ticker,category,weight,sector}]
    (소수 비중), tilt_rationale.

risk_review:
  agent: risk_officer
  description: >
    PM 초안과 제약검증·하우스뷰·이벤트 리스크를 검토하라.

    [PM 초안] 위 컨텍스트 / [결정론 제약검증] {constraints_json}
    [하우스뷰] {research_view_json} / [초안 배분] {det_draft_json}

    집중도·상관 클러스터·유동성·이벤트 겹침을 평가하고 PM 틸트가 하우스뷰로 정당화되는지 본다.
    verdict: APPROVED / CONDITIONAL / REJECTED. REJECTED 는 실질 리스크가 있을 때만.
  expected_output: >
    RiskReview JSON: verdict(APPROVED|CONDITIONAL|REJECTED), conditions[], concerns[].

post_mortem:
  agent: performance_reviewer
  description: >
    아래는 과거 한 판단의 **당시 기록**(그때 가용했던 정보만)과 채점 결과다.
    사후에 재구성된 내러티브는 주어지지 않는다 — 결과를 알고 원인을 소급하지 마라.

    [claim_type] {claim_type}
    [당시 주장] {claim}
    [당시 근거] {reasoning}
    [당시 참조] {supporting_refs}
    [당시 데이터 스냅샷] {data_snapshot}
    [당시 상황] {situation_text}
    [결정 내용] {decision}
    [채점 결과 (수치, 확정)] {outcome}

    강제 구조 (구체적 신호·인용 없으면 폐기):
    - missed_signal: 당시 가용했으나 놓친 신호를 스냅샷/참조에서 실제 인용. 없었으면 "none: <이유>".
    - underestimated_because: 그 신호를 저평가한 이유.
    - what_would_change: 다음에 적용할 구체적 수정 휴리스틱 (규칙 형태). "더 신중했어야"·"주의 필요" 류는 폐기.

    그 다음:
    - what_happened: 결과를 1~2문장으로. {outcome} 의 수치만 인용하고 새 숫자를 만들지 마라.
    - root_cause: verdict 가 miss/partial 이면 근본 원인, hit 면 null.
    - lesson: 일반화 가능한 교훈 한 문장.
    - base_rate_note: 유사 셋업의 과거 기저율 (예: "규제 공포 3건 중 2건 hit").
    - lesson_card: 25 토큰 이내. 형식 "[신호축약·조건] 결론".
    - event_tags / theme_tags: 아래 목록에서만 (없으면 빈 리스트).
        events: {semi_open_events}
        themes: {semi_open_themes}
    - mistake_tag: 아래에서 1개 (해당 없으면 none). {closed_mistakes}
  expected_output: >
    ReviewerOutput JSON: what_happened, missed_signal, underestimated_because, what_would_change,
    root_cause(nullable), lesson, base_rate_note, lesson_card, event_tags[], theme_tags[], mistake_tag.

cio_decision:
  agent: cio
  description: >
    위 컨텍스트에 MacroBrief·ResearchView·RiskReview 가 있다. 아래는 산출이다.

    [초안 포트폴리오] {draft_json}
    [제약 검증] {constraints_json}
    [배분 요약] {allocation_json}
    [레짐] {regime_summary}

    verdict 를 APPROVED 또는 HOLD 로 정하라. 기본 APPROVED. HOLD 는 CRISIS / 하우스뷰·Risk 의
    중대 리스크 / 실질적 제약 FAIL 일 때만. HOLD 면 hold_reason 필수. 주문 수량·비중 불변.
    ic_memo 에 근거를 3~5문장.
  expected_output: >
    CIODecision JSON: verdict(APPROVED|HOLD), ic_memo, concerns[], hold_reason(HOLD 시).
