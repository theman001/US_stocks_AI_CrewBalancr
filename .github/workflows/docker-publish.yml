name: docker image (ghcr, arm64)

# Radxa Rock 5 (RK3588 / arm64) 배포용 이미지를 GHCR 에 게시.
# OMV8 은 이 이미지를 pull 만 한다 (빌드는 여기서). deploy/DEPLOY.md 참조.

on:
  push:
    branches: [main]
    paths:
      - "aegisvest/**"
      - "config/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - "deploy/crontab"
      - ".dockerignore"
      - ".github/workflows/docker-publish.yml"
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-publish
  cancel-in-progress: true

jobs:
  build:
    # QEMU 로 arm64 크로스빌드 (~15분, 항상 가용). 속도 원하면 runs-on: ubuntu-24.04-arm
    # (public repo 무료 네이티브 러너) 로 바꾸고 아래 setup-qemu-action 제거.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/aegisvest
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
