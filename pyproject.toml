[project]
name = "aegisvest"
version = "0.1.0"
description = "CrewAI 미국주식 다중 에이전트 투자 시스템"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.50",
    "requests>=2.32",
]

[project.optional-dependencies]
# 3a-9 이후 (에이전트 계층). 초기 결정론 단계엔 미설치.
# 툴 데코레이터는 `crewai.tools` (core 번들) — crewai-tools 별도 패키지 불요.
agents = [
    "crewai>=0.100",
]
# Phase 4 판단 일기 RAG. ARM 빌드 시간 절약 위해 분리.
diary = [
    "chromadb>=0.5",
    "FlagEmbedding>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "types-pyyaml",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aegisvest"]

# ─────────────────────────── ruff ───────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["state", "outputs", "data", "report", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "PD"]
ignore = [
    "PLR0913",  # too many args (툴 시그니처)
    "PLR2004",  # magic value (임계값 비교 다수)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

# ─────────────────────────── mypy ───────────────────────────
[tool.mypy]
python_version = "3.12"
packages = ["aegisvest"]
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yfinance.*", "crewai.*", "chromadb.*", "FlagEmbedding.*"]
ignore_missing_imports = true

# ─────────────────────────── pytest ─────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-q --strict-markers -m "not llm and not net"'
markers = [
    "llm: 실제 DeepSeek API 필요 (기본 스킵)",
    "net: 네트워크 필요",
]
filterwarnings = [
    "ignore::DeprecationWarning:crewai.*",
    "ignore:function callbacks cannot be serialized:UserWarning",
]
