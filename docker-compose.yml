# AegisVest — 단일 스택. OMV8 openmediavault-compose 에 이 파일 하나만 붙여넣고 Up.
#
# 이미지는 GHCR 에서 pull (빌드는 GitHub Actions — .github/workflows/docker-publish.yml).
# repo·Dockerfile·crontab 을 OMV 에 얹을 필요 없음. 상세: deploy/DEPLOY.md
#
# 갱신: OMV-compose 에서 Pull → Up (또는 `docker compose pull && docker compose up -d`).

services:
  aegisvest:
    image: ghcr.io/theman001/aegisvest:latest
    container_name: aegisvest
    env_file: .env # OMV-compose "Environment" 탭이 생성/관리 (DEEPSEEK_API_KEY 등)
    environment:
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ${AEGIS_DATA:?AEGIS_DATA 미설정 — .env 에 OMV 공유폴더 경로}/state:/app/state
      - ${AEGIS_DATA}/outputs:/app/outputs
      - ${AEGIS_DATA}/cache:/app/data/cache
      - ${AEGIS_DATA}/logs:/app/logs
      - hf-cache:/app/hf-cache # bge-m3 가중치 (~2.3GB) — 첫 다운로드 후 영구 보존
    restart: unless-stopped
    # bge-m3 상주(~3GB) + chromadb + crew. RAM 8GB 미만 보드면 .env 에서 낮추고 swap 확보.
    mem_limit: ${AEGIS_MEM:-4g}
    cpus: 2

volumes:
  hf-cache:
